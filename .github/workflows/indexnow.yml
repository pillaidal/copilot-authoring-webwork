name: "IndexNow Automation"

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering if needed

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Submit to IndexNow
        uses: bojieyang/indexnow-action@v3
        with:
          # Fixed to point to your actual public sitemap file
          sitemap-location: "https://github.io"
          # Fixed to match the exact secret name from your screenshot
          key: ${{ secrets.INDEXNOW_KEY }}
